name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate editorial data
        run: python scripts/validate_data.py

      - name: Validate V3 seed registry
        run: python scripts/validate_registry.py

      - name: Validate V3.1 sharded registry scale
        run: python scripts/validate_registry_scale.py

      - name: Validate V3 seed catalog
        run: python scripts/validate_v3_catalog.py

      - name: Validate V3.1 catalog totals
        run: python scripts/validate_v3_1_catalog.py

      - name: Build public catalog
        run: python scripts/build_public_catalog.py --output data/catalog.public.json

      - name: Validate image rights
        run: python scripts/validate_media_rights.py

      - name: Validate SAMPO media overrides
        run: python scripts/validate_sampo_media.py

      - name: Validate Tatung media overrides
        run: python scripts/validate_tatung_media.py

      - name: Validate O'right media scope
        run: python scripts/validate_oright_media.py

      - name: Validate V3 site
        run: python scripts/validate_site.py

      - name: Check magazine JavaScript
        run: node --check assets/magazine.js

      - name: Check image enhancements
        run: node --check assets/product-image-enhancements.js

      - name: Check V3 loader JavaScript
        run: node --check assets/catalog-v3.js

      - name: Check V3.1 catalog JavaScript
        run: node --check assets/catalog-v3-1.js

      - name: Check V2.5 preview JavaScript
        run: node --check assets/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
