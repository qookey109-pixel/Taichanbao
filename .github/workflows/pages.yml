name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate data
        run: python scripts/validate_data.py

      - name: Validate image rights
        run: python scripts/validate_media_rights.py

      - name: Validate site
        run: python scripts/validate_site.py

      - name: Check magazine JavaScript
        run: node --check assets/magazine.js

      - name: Check image enhancements
        run: node --check assets/product-image-enhancements.js

      - name: Check V2.5 preview JavaScript
        run: node --check assets/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
