name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/deployment/pages-production-result.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate editorial data
        run: python scripts/validate_data.py

      - name: Validate V3 seed registry
        run: python scripts/validate_registry.py

      - name: Validate V3.1 sharded registry scale
        run: python scripts/validate_registry_scale.py

      - name: Validate V3 seed catalog
        run: python scripts/validate_v3_catalog.py

      - name: Validate V3.1 catalog totals
        run: python scripts/validate_v3_1_catalog.py

      - name: Build public catalog
        run: python scripts/build_public_catalog.py --output data/catalog.public.json

      - name: Validate registry expiry state
        run: python scripts/report_registry_expiry.py --check-only

      - name: Build registry expiry report
        run: python scripts/report_registry_expiry.py --output data/registry-expiry.json

      - name: Validate V3.2 lifecycle dashboard
        run: python scripts/validate_lifecycle_v3_2.py

      - name: Validate image rights
        run: python scripts/validate_media_rights.py

      - name: Validate SAMPO media overrides
        run: python scripts/validate_sampo_media.py

      - name: Validate Tatung media overrides
        run: python scripts/validate_tatung_media.py

      - name: Validate O'right media scope
        run: python scripts/validate_oright_media.py

      - name: Validate V3 site
        run: python scripts/validate_site.py

      - name: Check magazine JavaScript
        run: node --check assets/magazine.js

      - name: Check image enhancements
        run: node --check assets/product-image-enhancements.js

      - name: Check V3 loader JavaScript
        run: node --check assets/catalog-v3.js

      - name: Check V3.1 catalog JavaScript
        run: node --check assets/catalog-v3-1.js

      - name: Check V3.2 lifecycle JavaScript
        run: node --check assets/lifecycle-v3-2.js

      - name: Check V2.5 preview JavaScript
        run: node --check assets/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Write production deployment diagnostic
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/deployment
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "workflow": "Deploy GitHub Pages",
              "trigger_sha": os.environ.get("TRIGGER_SHA", ""),
              "build_result": os.environ.get("BUILD_RESULT", ""),
              "deploy_result": os.environ.get("DEPLOY_RESULT", ""),
              "page_url": os.environ.get("PAGE_URL", ""),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("docs/deployment/pages-production-result.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit production deployment diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployment/pages-production-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record production Pages deployment result"
          git push origin HEAD:main
