name: Validate site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_data.py
      - run: python scripts/validate_registry.py
      - run: python scripts/validate_registry_scale.py
      - run: python scripts/validate_v3_catalog.py
      - run: python scripts/validate_v3_1_catalog.py
      - run: python scripts/validate_v3_3_catalog.py
      - run: python scripts/validate_category_balance.py
      - run: python scripts/build_public_catalog.py --check-only
      - run: python scripts/report_registry_expiry.py --check-only
      - run: python scripts/validate_lifecycle_v3_2.py
      - run: python scripts/validate_enrichment_v3_4.py
      - run: python scripts/validate_media_rights.py
      - run: python scripts/validate_sampo_media.py
      - run: python scripts/validate_tatung_media.py
      - run: python scripts/validate_oright_media.py
      - run: python scripts/validate_site.py
      - run: node --check assets/magazine.js
      - run: node --check assets/product-image-enhancements.js
      - run: node --check assets/catalog-v3.js
      - run: node --check assets/catalog-v3-1.js
      - run: node --check assets/lifecycle-v3-2.js
      - run: node --check assets/scale-v3-3.js
      - run: node --check assets/enrichment-v3-4.js
      - run: node --check assets/app.js
