name: Pages Recovery Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-recovery.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-recovery
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository root
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy current main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
