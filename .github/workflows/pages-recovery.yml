name: Pages Recovery Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-recovery.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-recovery
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository root
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy current main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Write recovery diagnostic
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/deployment
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "workflow": "Pages Recovery Diagnostic",
              "trigger_sha": os.environ.get("TRIGGER_SHA", ""),
              "deploy_result": os.environ.get("DEPLOY_RESULT", ""),
              "page_url": os.environ.get("PAGE_URL", ""),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("docs/deployment/pages-recovery-result.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit recovery diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployment/pages-recovery-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Pages recovery diagnostic"
          git push origin HEAD:main
