name: Pages Build Gate Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-build-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all production build checks without stopping early
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          checks = [
              ("validate_data", ["python", "scripts/validate_data.py"]),
              ("validate_registry_seed", ["python", "scripts/validate_registry.py"]),
              ("validate_registry_scale", ["python", "scripts/validate_registry_scale.py"]),
              ("validate_v3_catalog", ["python", "scripts/validate_v3_catalog.py"]),
              ("validate_v3_1_catalog", ["python", "scripts/validate_v3_1_catalog.py"]),
              ("build_public_catalog_check", ["python", "scripts/build_public_catalog.py", "--check-only"]),
              ("registry_expiry_check", ["python", "scripts/report_registry_expiry.py", "--check"]),
              ("validate_media_rights", ["python", "scripts/validate_media_rights.py"]),
              ("validate_sampo_media", ["python", "scripts/validate_sampo_media.py"]),
              ("validate_tatung_media", ["python", "scripts/validate_tatung_media.py"]),
              ("validate_oright_media", ["python", "scripts/validate_oright_media.py"]),
              ("validate_site", ["python", "scripts/validate_site.py"]),
              ("node_magazine", ["node", "--check", "assets/magazine.js"]),
              ("node_image_enhancements", ["node", "--check", "assets/product-image-enhancements.js"]),
              ("node_catalog_loader", ["node", "--check", "assets/catalog-v3.js"]),
              ("node_catalog_v3_1", ["node", "--check", "assets/catalog-v3-1.js"]),
              ("node_v2_5_preview", ["node", "--check", "assets/app.js"]),
          ]

          results = []
          for name, command in checks:
              proc = subprocess.run(command, text=True, capture_output=True)
              output = ((proc.stdout or "") + (proc.stderr or "")).strip()
              results.append({
                  "name": name,
                  "command": " ".join(command),
                  "exit_code": proc.returncode,
                  "ok": proc.returncode == 0,
                  "log_tail": output[-6000:],
              })

          payload = {
              "workflow": "Pages Build Gate Diagnostic",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "all_passed": all(item["ok"] for item in results),
              "failed": [item["name"] for item in results if not item["ok"]],
              "results": results,
          }
          Path("docs/deployment").mkdir(parents=True, exist_ok=True)
          Path("docs/deployment/pages-build-diagnostic.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"all_passed": payload["all_passed"], "failed": payload["failed"]}, ensure_ascii=False))
          PY

      - name: Commit build diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployment/pages-build-diagnostic.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Pages build gate diagnostic"
          git push origin HEAD:main
